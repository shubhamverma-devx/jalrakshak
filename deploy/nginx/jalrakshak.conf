# =============================================================================
#  nginx — JalRakshak (dashboard + API ek hi domain pe)
#  Install: /etc/nginx/sites-available/jalrakshak  ->  sites-enabled/
#  __DOMAIN__ ko harden.sh asli domain se badalta hai. HTTPS block `certbot --nginx`
#  khud jodta hai.
# =============================================================================
#  KYUN EK DOMAIN (dashboard + /api): do subdomain = do certificate, CORS, do jagah fail
#  hone ka mauka. Ek domain pe dashboard `https://__DOMAIN__/api` bulata hai.
#
#  SABSE ZAROORI BAAT: dashboard (/) aur bundled fallback (/fallback/*.json) nginx SEEDHA
#  disk se deta hai — PHP aur MySQL dono band hon tab bhi pehli screen khulti hai.
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/jalrakshak/dashboard/dist;
    index index.html;

    access_log /var/log/nginx/jalrakshak.access.log;
    error_log  /var/log/nginx/jalrakshak.error.log warn;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # --- Laravel API -------------------------------------------------------------
    location ^~ /api/ {
        root /var/www/jalrakshak/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        root /var/www/jalrakshak/backend/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm-jalrakshak.sock;
        # php-fpm ka request_terminate_timeout 30s hai; nginx thoda zyada ruke.
        fastcgi_read_timeout 35s;
    }

    # --- Bundled fallback JSON: hamesha taaza version (deploy ke baad purana na dikhe) ---
    location ^~ /fallback/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # --- Vite assets: naam mein hash hai, isliye hamesha ke liye cache -----------
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- SPA: baaki sab index.html (koi PHP nahi) ---------------------------------
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Dotfiles (.env, .git) kabhi serve nahi
    location ~ /\.(?!well-known) { deny all; }
}
