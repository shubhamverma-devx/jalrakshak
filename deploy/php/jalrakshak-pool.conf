; =============================================================================
;  php-fpm pool — sirf JalRakshak ke liye
;  Install: /etc/php/8.3/fpm/pool.d/jalrakshak.conf
; =============================================================================
;  KYUN ALAG POOL (www pool mein nahi): droplet pe do aur Laravel sites chal rahi hain.
;  Alag pool se JalRakshak ki RAM ki ek pakki chhat (ceiling) ban jaati hai — agar
;  judge ke waqt traffic aaye to bhi ye pool baaki do sites ki memory nahi kha sakta, aur
;  baaki sites ka load JalRakshak ko nahi gira sakta.
;
;  NUMBERS (poora hisaab deploy/README.md mein):
;    Laravel worker ~40-50 MB RSS. max_children 4 => worst case ~200 MB.
;    Dashboard static hai (nginx), API ke reads cached hain (<50ms) — 4 worker ek saath
;    4 request, yaani ~80 req/sec. Ek hackathon demo URL ke liye bahut hai.
; =============================================================================
[jalrakshak]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm-jalrakshak.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ondemand: koi request nahi to ZERO worker. Judge hafton baad aayega — tab tak ye
; pool ek bhi MB nahi lega. Pehli request pe worker ~50ms mein uthta hai.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s
; Har worker 300 request ke baad naya — PHP ki dheere-dheere badhti memory (leak) kabhi
; hafton jama nahi hoti.
pm.max_requests = 300

; Koi request 30s se zyada chale to maar do — atka worker pool ka 25% hota hai.
request_terminate_timeout = 30s

; Laravel API ke liye 96M kaafi hai (Ubuntu default 128M). Chhoti chhat = ek bigdi request
; poora RAM nahi kha sakti. (CLI — risk:compute/cron — php-cli ka apna ini use karta hai.)
php_admin_value[memory_limit] = 96M
php_admin_value[max_execution_time] = 30

