# =============================================================================
#  systemd drop-in — nginx, php8.3-fpm, mysql teeno ke liye
#  Install: /etc/systemd/system/<service>.service.d/restart.conf
# =============================================================================
#  KYUN: service crash ho (ya OOM-killer maar de) to systemd 5 sec mein khud uthaye.
#  Ubuntu pe nginx aur php-fpm ke unit mein Restart= hota hi NAHI — ek baar gira to
#  tab tak gira rehta hai jab tak koi SSH karke na uthaye. Ye pehli line of defence
#  hai; jr-watchdog.timer doosri (agar ye bhi haar maan le).
#
#  StartLimit: 10 min mein 10 se zyada restart ho to systemd ruk jaata hai (crash-loop
#  mein CPU na jale). Watchdog `reset-failed` karke 2 min baad phir koshish karta hai.
# =============================================================================
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=10

[Service]
Restart=on-failure
RestartSec=5s
